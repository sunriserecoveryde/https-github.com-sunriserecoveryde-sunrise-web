kind = "web"
previewPath = "/"
title = "SunriseOS"
version = "1.0.0"
id = "artifacts/sunrise-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22957

[services.development]
run = "pnpm --filter @workspace/sunrise-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunrise-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/sunrise-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22957"
BASE_PATH = "/"
