kind = "mobile"
previewPath = "/sunrise-staff/"
title = "Sunrise Staff"
version = "1.0.0"
id = "artifacts/sunrise-staff"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/sunrise-staff/" ]
localPort = 20501

[services.development]
run = "pnpm --filter @workspace/sunrise-staff run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunrise-staff", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sunrise-staff", "run", "serve" ]

[services.env]
PORT = "20501"
BASE_PATH = "/sunrise-staff/"
