kind = "web"
previewPath = "/"
title = "Sunrise OS — Marketing & Investor Site"
version = "1.0.0"
id = "artifacts/sunrise-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21712

[services.development]
run = "pnpm --filter @workspace/sunrise-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunrise-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/sunrise-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21712"
BASE_PATH = "/"
