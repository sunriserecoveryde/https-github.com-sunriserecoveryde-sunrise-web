<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#0F172A"/>
  <!-- Sun rays -->
  <line x1="90" y1="22" x2="90" y2="38" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="32" x2="122" y2="46" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="152" y1="66" x2="138" y2="71" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="58" y2="46" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <line x1="28" y1="66" x2="42" y2="71" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <!-- Sun semicircle (top half only, above horizon) -->
  <path d="M42 105 A48 48 0 0 1 138 105" fill="#F97316"/>
  <ellipse cx="90" cy="105" rx="48" ry="48" fill="#F97316" clip-path="url(#topHalf)"/>
  <clipPath id="topHalf">
    <rect x="0" y="0" width="180" height="105"/>
  </clipPath>
  <!-- Horizon line -->
  <rect x="28" y="108" width="124" height="5" rx="2.5" fill="#FB923C"/>
  <!-- Ground gradient bars -->
  <rect x="38" y="120" width="104" height="4" rx="2" fill="#F97316" opacity="0.6"/>
  <rect x="52" y="130" width="76" height="4" rx="2" fill="#FBBF24" opacity="0.4"/>
  <rect x="64" y="140" width="52" height="4" rx="2" fill="#FDE68A" opacity="0.3"/>
</svg>
