kind = "mobile"
previewPath = "/grow-motivational-app/"
title = "Grow Motivational App"
version = "1.0.0"
id = "artifacts/grow-motivational-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/grow-motivational-app/" ]
localPort = 25383

[services.development]
run = "pnpm --filter @workspace/grow-motivational-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grow-motivational-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/grow-motivational-app", "run", "serve" ]

[services.env]
PORT = "25383"
BASE_PATH = "/grow-motivational-app/"
