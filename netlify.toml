[build]
  command   = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/sunrise-web run build"
  publish   = "artifacts/sunrise-web/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PORT         = "3000"
  BASE_PATH    = "/"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
